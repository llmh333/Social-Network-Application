services:
  db:
    image: mysql:8.0.30
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - '3307:3306'
    deploy:
      resources:
        limits:
          memory: 300MB
        reservations:
          memory: 200MB
    networks:
      - chillandchill-network
  spring-service:
    image: hieutd3q/chillandchill:0.0.2
    container_name: spring-app
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - /BE/.env
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 256MB
    networks:
      - chillandchill-network
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    networks:
      - chillandchill-network
    depends_on:
      - spring-service
networks:
  chillandchill-network:
    driver: bridge
