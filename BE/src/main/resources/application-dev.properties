#App
server.port=8080

#DATABASE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/chillandchill?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.output.ansi.enabled=ALWAYS

#JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

#JWT
jwt.secret=${JWT_SECRET_KEY}
#Expiration time (minutes)
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION_TIME}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION_TIME}

cron.deleteExpiredTokenBlacklist=0 0 1 * * *

#Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}


#Swagger
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.projectbase.controller
springdoc.pathsToMatch=/**

#Infor Mail Send OTP
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

#Info Admin
admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}
admin.lastName=${ADMIN_LASTNAME}
admin.firstName=${ADMIN_FIRSTNAME}
admin.email=${ADMIN_EMAIL}

spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}

# OAuth2 Client GoogleConfiguration
spring.security.oauth2.client.registration.google.client-id=${OAUTH2_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH2_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${OAUTH2_GOOGLE_SCOPE}
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_URI}

spring.security.oauth2.client.registration.facebook.client-id=${OAUTH2_FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${OAUTH2_FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=${OAUTH2_FACEBOOK_SCOPE}
spring.security.oauth2.client.registration.facebook.redirect-uri=${OAUTH2_REDIRECT_URI}
spring.security.oauth2.client.registration.facebook.provider=${OAUTH2_FACEBOOK_PROVIDER}

# Provider info
spring.security.oauth2.client.provider.facebook.authorization-uri=${OAUTH2_FACEBOOK_AUTHORIZATION_URL}
spring.security.oauth2.client.provider.facebook.token-uri=${OAUTH2_FACEBOOK_TOKEN_URI}
spring.security.oauth2.client.provider.facebook.user-info-uri=${OAUTH2_FACEBOOK_USER_INFO_URI}
spring.security.oauth2.client.provider.facebook.user-name-attribute=${OAUTH2_FACEBOOK_USERNAME_ATTRIBUTE}

#Redis cloud
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.client-name=${REDIS_CLIENT_NAME}
spring.redis.password=${REDIS_PASSWORD}
spring.redis.database=${REDIS_DATABASE}