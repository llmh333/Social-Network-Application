#App
server.port=8080
server.forward-headers-strategy=framework
#DATABASE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/chillandchill?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}

spring.output.ansi.enabled=ALWAYS





#JPA / HIBERNATE
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

#JWT
jwt.secret=${JWT_SECRET_KEY}
#Expiration time (minutes)
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION_TIME}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION_TIME}

cron.deleteExpiredTokenBlacklist=0 0 1 * * *

#Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}


#Swagger
springdoc.api-docs.enabled=true
springdoc.packagesToScan=com.example.projectbase.controller
springdoc.pathsToMatch=/**

#Infor Mail Send OTP
spring.mail.username=${MAIL_USERNAME:hitchillguy@gmail.com}
spring.mail.password=${MAIL_PASSWORD:knargisougetmdft}

#Info Admin
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin}
admin.lastName=${ADMIN_LASTNAME:chill}
admin.firstName=${ADMIN_FIRSTNAME:guy}
admin.email=${ADMIN_EMAIL:admin@example.com}

spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:400MB}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:400MB}

#Redis cloud
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE}